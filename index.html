<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suunto Body AI Scale Demo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050607'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff6b2a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SUUNTO BODY CONCEPT</p>
          <h1>智能体脂秤固件交互 Demo</h1>
        </div>
        <p class="topbar-note">左侧固定展示体脂秤，右侧只负责选择测量和追问</p>
      </header>

      <section class="demo-grid" aria-label="智能体脂秤固件演示">
        <section class="device-stage" aria-label="体脂秤设备和固件屏幕">
          <div class="device-header">
            <span>Wi-Fi synced</span>
            <span>Battery 86%</span>
            <span>Family 3/16</span>
          </div>

          <div class="scale-visual" id="scaleVisual">
            <div class="handle">
              <div class="hand-electrode"></div>
              <div class="firmware-screen" aria-live="polite">
                <div class="screen-top">
                  <span id="screenMode">READY</span>
                  <span id="screenSignal">86%</span>
                </div>

                <div class="screen-content" id="screenContent">
                  <div class="screen-kicker">SUUNTO BODY</div>
                  <div class="screen-main">READY</div>
                  <div class="screen-sub">站上设备开始测量</div>
                </div>
              </div>
              <div class="hand-electrode"></div>
            </div>

            <div class="scale-body">
              <div class="scan-ring"></div>
              <div class="footprints">
                <div class="foot"><span></span><span></span></div>
                <div class="foot"><span></span><span></span></div>
              </div>
              <div class="weight-readout" id="weightReadout">--.- kg</div>
              <div class="scale-label" id="scaleLabel">8 electrodes · tri-frequency BIA</div>
            </div>
          </div>

          <div class="primary-actions">
            <button class="primary" id="startMeasure">开始完整体脂测量</button>
            <button id="weightOnly">普通称重演示</button>
          </div>
        </section>

        <aside class="control-panel" aria-label="演示控制台">
          <section class="panel-card">
            <div class="panel-title">
              <p class="eyebrow">DEMO CONTROL</p>
              <h2 id="flowTitle">待机</h2>
            </div>
            <div class="step-list" aria-label="当前演示步骤">
              <span class="active" data-step="wake">1 上秤</span>
              <span data-step="contact">2 接触</span>
              <span data-step="scan">3 测量</span>
              <span data-step="result">4 结果</span>
              <span data-step="coach">5 追问</span>
            </div>
            <div class="progress-block">
              <div class="progress-meta">
                <span id="progressLabel">等待开始</span>
                <span id="progressValue">0%</span>
              </div>
              <div class="progress-track"><div id="progressBar"></div></div>
            </div>
          </section>

          <section class="panel-card compact">
            <div class="panel-row">
              <span>本次归属</span>
              <strong id="userMatch">未测量</strong>
            </div>
            <button class="secondary-action" id="switchUser" disabled>更正用户</button>
          </section>

          <section class="panel-card compact" id="summaryCard">
            <p class="eyebrow">MEASUREMENT SUMMARY</p>
            <div class="summary-grid">
              <div><span>体重</span><strong id="metricWeight">--</strong></div>
              <div><span>体脂</span><strong id="metricFat">--</strong></div>
              <div><span>骨骼肌</span><strong id="metricMuscle">--</strong></div>
              <div><span>水分</span><strong id="metricWater">--</strong></div>
            </div>
          </section>

          <section class="panel-card">
            <div class="coach-heading">
              <span class="pulse"></span>
              <h2>AI 追问</h2>
            </div>
            <div class="quick-actions">
              <button data-question="今天练什么？">今天练什么？</button>
              <button data-question="怎么补水？">怎么补水？</button>
              <button data-question="给我一节课程">给我一节课程</button>
              <button data-question="明天有长跑怎么办？">明天有长跑怎么办？</button>
            </div>
          </section>

          <button class="reset-action" id="resetDemo">回到待机</button>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
